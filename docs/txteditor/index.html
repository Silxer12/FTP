<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTP TXT Editor</title>
    <link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="../all.css">
</head>
<body>
	<button class="settings-btn" onclick="toggleSettings()">
		<img src="../settings-icon.png" alt="">
	</button>

	<aside id="settingsMenu" class="side-menu" hidden>
		<button id="closeBtn" class="close-btn" onclick="toggleSettings()">Close Settings</button>

		<div class="settings-section">
			<label for="theme">Theme</label>

			<select id="theme" class="setting-select">
				<option value="system">System</option>
				<option value="light">Light</option>
				<option value="dark">Dark</option>
			</select>

		</div>
	</aside>

	<main>
		<textarea id="textarea" placeholder="Start typing here..."></textarea>
	</main>

	<footer>
		<div>
			<a href="../index.html">Tool Hub</a>
			·
			<a href="https://github.com/Silxer12/FTP">Source</a>
		</div>
		<span> "For The People" </span>
	</footer>

</body>
<script src="script.js"></script>
<script src="../all.js"></script>
</html>
