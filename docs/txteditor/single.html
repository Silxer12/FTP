<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTP TXT Editor</title>
</head>
<body>
	<textarea id="textarea"></textarea>
</body>
<script>
    const textarea = document.getElementById('textarea');

    // make tab actually type a tab
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
        
            const start = this.selectionStart;
            const end = this.selectionEnd;

            this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);

            this.selectionStart = this.selectionEnd = start + 1;
        }
    });

    // make text save in a new doc when Crtl+S-ing
    document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        
        saveAsContent();
    }});

    async function saveAsContent() {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: 'new-text-file.txt',
                types: [{
                    description: 'TXT File',
                    accept: { 'text/plain': ['.txt'] },
                }],
            });
            
            const writable = await handle.createWritable();
            await writable.write(textarea.value);
            await writable.close();
            
        } catch (err) {
            console.log('ERR: Could not save file. ERR Message:', err);
        }
    }
</script>
<style>
    body {
        overflow: hidden; /* disable scrolling */

        /* take up whole page */
        height: 100vh;
        margin: 0;

        /* ability to add the footer and still work */
        display: flex;
        flex-direction: column;
    }

    textarea {
        box-sizing: border-box; 
        padding: 0.5%; /* add some padding to make it not cutoff a little at edges */

        /* take up all the body that isnt the footer */
        width: 100%;
        flex: 1;

        /* make it look neat and readable */
        resize: none;
        border: none;
        outline: none;
        tab-size: 4;
        font-size: large;
    }
</style>
</html>
